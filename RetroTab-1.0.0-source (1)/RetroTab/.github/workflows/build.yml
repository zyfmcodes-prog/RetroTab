name: Build RetroTab jar
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: "RetroTab-1.0.0-source (1)/RetroTab"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: "RetroTab-1.0.0-source (1)/RetroTab/pom.xml"
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: RetroTab-jar
          path: "RetroTab-1.0.0-source (1)/RetroTab/target/RetroTab-1.0.0.jar"
